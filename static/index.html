<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FALCON</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg: #0a0c10;
        --accent: #ff8a3d;
        --accent-dim: rgba(255, 138, 61, 0.35);
        --accent-faint: rgba(255, 138, 61, 0.08);
        --border: rgba(255, 138, 61, 0.18);
        --text-primary: #eef1f6;
        --text-secondary: #c3c9d4;
        --text-dim: #5c6474;
        --label-dim: #8a93a3;
        --track: rgba(255, 255, 255, 0.08);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        height: 100vh;   /* 古いブラウザ向けのフォールバック */
        height: 100dvh;  /* モバイルSafariのアドレスバー分を正しく除いた高さ */
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .mono {
        font-family: 'JetBrains Mono', monospace;
    }

    /* ★背景演出用のフック★ 今は空。将来ここに
       background-image: url(...) を1行足すだけで画像を差し込める */
    #brain-visual {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
    }

    header {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(to bottom, rgba(4, 5, 9, 0.92), rgba(4, 5, 9, 0.75));
    }

    #brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
    }

    #brand .logo {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.1em;
        color: var(--accent);
        white-space: nowrap;
    }

    #brand .subtitle {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        text-transform: uppercase;
        white-space: nowrap;
    }

    #stat-bars {
        display: flex;
        gap: 16px;
    }

    .stat {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 60px;
    }

    .stat .stat-label {
        font-size: 9px;
        color: var(--text-dim);
        letter-spacing: 0.08em;
    }

    .stat .stat-track {
        height: 4px;
        background: var(--track);
        border-radius: 2px;
        overflow: hidden;
    }

    .stat .stat-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.6s ease;
    }

    #status-indicator {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 12px;
        border: 1px solid var(--accent-dim);
        border-radius: 100px;
        background: var(--accent-faint);
        flex-shrink: 0;
    }

    #status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.35;
    }

    #status-indicator.processing #status-dot {
        opacity: 1;
        animation: falcon-pulse 1.2s infinite;
    }

    #status-label {
        font-size: 10px;
        color: var(--accent);
        letter-spacing: 0.05em;
        white-space: nowrap;
    }

    @keyframes falcon-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
    }

    #chat-log {
        position: relative;
        z-index: 1;
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        font-size: 14px;
        line-height: 1.6;
    }

    .line {
        display: flex;
        gap: 8px;
        align-items: flex-start;
    }

    .line .prompt {
        flex-shrink: 0;
        color: var(--accent);
    }

    .line.falcon .prompt {
        color: var(--label-dim);
    }

    .line.user .text {
        color: var(--text-primary);
    }

    .line.falcon .text {
        color: var(--text-secondary);
    }

    .line.system {
        justify-content: center;
        color: var(--text-dim);
        font-size: 11px;
        text-align: center;
    }

    #chat-form {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
        background: rgba(4, 5, 9, 0.92);
        border-top: 1px solid var(--border);
    }

    #prompt-icon {
        font-size: 18px;
        color: var(--accent);
        flex-shrink: 0;
    }

    #message-input {
        flex: 1;
        min-width: 0;
        padding: 10px 14px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
    }

    #message-input:focus {
        outline: none;
        border-color: var(--accent-dim);
    }

    #chat-form button {
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        border-radius: 50%;
        border: 1px solid var(--accent-dim);
        background: transparent;
        color: var(--accent);
        font-size: 16px;
    }

    #chat-form button:disabled {
        opacity: 0.4;
    }

    #status-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #speaker-toggle,
    #reload-button {
        background: transparent;
        border: none;
        font-size: 16px;
        line-height: 1;
        padding: 4px;
        flex-shrink: 0;
        cursor: pointer;
    }

    /* マイクボタンは #chat-form button のスタイル(丸・アクセント枠)を共有する。
       聞き取り中だけ .listening を付けて、既存の falcon-pulse アニメーションで光らせる */
    #mic-button.listening {
        background: var(--accent-faint);
        border-color: var(--accent);
        animation: falcon-pulse 1s infinite;
    }

    /* モバイル幅ではCPU/MEM/NETバーとサブタイトルを隠してスペースを確保 */
    @media (max-width: 600px) {
        #stat-bars { display: none; }
        #brand .subtitle { display: none; }
    }
    </style>
</head>
<body>
    <div id="brain-visual"></div>

    <header>
        <div id="brand">
            <span class="logo mono">FALCON</span>
            <span class="subtitle mono">AI CORE INTERFACE</span>
        </div>

        <div id="stat-bars">
            <div class="stat">
                <span class="stat-label mono">CPU</span>
                <div class="stat-track"><div class="stat-fill" id="cpu-fill"></div></div>
            </div>
            <div class="stat">
                <span class="stat-label mono">MEM</span>
                <div class="stat-track"><div class="stat-fill" id="mem-fill"></div></div>
            </div>
            <div class="stat">
                <span class="stat-label mono">NET</span>
                <div class="stat-track"><div class="stat-fill" id="net-fill"></div></div>
            </div>
        </div>

        <div id="status-group">
            <div id="status-indicator">
                <div id="status-dot"></div>
                <span id="status-label" class="mono">待機中 / IDLE</span>
            </div>
            <button id="speaker-toggle" type="button" title="読み上げのON/OFF">&#128266;</button>
            <button id="reload-button" type="button" title="再読み込み">&#128260;</button>
        </div>
    </header>

    <div id="chat-log"></div>

    <form id="chat-form">
        <span id="prompt-icon">&#10095;</span>
        <input type="text" id="message-input" placeholder="Ask FALCON anything..." autocomplete="off">
        <button type="button" id="mic-button" title="音声入力">&#127908;</button>
        <button type="submit">&#10148;</button>
    </form>

    <script>
const form = document.getElementById("chat-form");
const input = document.getElementById("message-input");
const log = document.getElementById("chat-log");
const statusIndicator = document.getElementById("status-indicator");
const statusLabel = document.getElementById("status-label");

function addMessage(sender, text) {
    const line = document.createElement("div");
    line.classList.add("line");

    if (sender === "隼") {
        line.classList.add("user");
        const prompt = document.createElement("span");
        prompt.classList.add("prompt", "mono");
        prompt.textContent = ">";
        const body = document.createElement("span");
        body.classList.add("text");
        body.textContent = text;
        line.append(prompt, body);
    } else if (sender === "FALCON") {
        line.classList.add("falcon");
        const prompt = document.createElement("span");
        prompt.classList.add("prompt", "mono");
        prompt.textContent = "FALCON>";
        const body = document.createElement("span");
        body.classList.add("text");
        body.textContent = text;
        line.append(prompt, body);
    } else {
        line.classList.add("system", "mono");
        line.textContent = text;
    }

    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
}

function setProcessing(isProcessing) {
    statusIndicator.classList.toggle("processing", isProcessing);
    statusLabel.textContent = isProcessing ? "処理中 / PROCESSING" : "待機中 / IDLE";
}

async function loadHistory() {
    const response = await fetch("/history");
    const data = await response.json();

    for (const entry of data.history) {
        addMessage(entry.sender, entry.text);
    }
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = input.value.trim();
    const wasVoice = nextSubmitIsVoice;
    nextSubmitIsVoice = false;
    if (!message) return;

    addMessage("隼", message);
    input.value = "";

    const submitButton = form.querySelector("button");
    submitButton.disabled = true;
    setProcessing(true);

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message }),
        });

        if (!response.ok) {
            addMessage("システム", "サーバーでエラーが発生しました。");
            return;
        }

        const data = await response.json();
        addMessage("FALCON", data.reply);
        speak(data.reply, { continueListening: wasVoice });
    } catch (error) {
        addMessage("システム", "FALCONに接続できませんでした。Wi-Fiやサーバーの状態を確認してください。");
    } finally {
        submitButton.disabled = false;
        setProcessing(false);
    }
});
// ★音声入力(STT)★ ブラウザ標準のWeb Speech APIを使う。
// 対応してないブラウザ(Firefox等)ではボタンごと隠す。テキスト入力は今まで通り使えるので実害は無い
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const micButton = document.getElementById("mic-button");

let recognition = null;
let isListening = false;
let nextSubmitIsVoice = false; // 直前の送信が音声由来だったかどうか(連続会話の判定に使う)

if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = "ja-JP";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.addEventListener("start", () => {
        isListening = true;
        micButton.classList.add("listening");
    });

    recognition.addEventListener("end", () => {
        isListening = false;
        micButton.classList.remove("listening");
    });

    recognition.addEventListener("result", (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        nextSubmitIsVoice = true;
        form.requestSubmit(); // 認識できたら自動送信する(会話のテンポを優先)
    });

    recognition.addEventListener("error", (event) => {
        if (event.error === "no-speech") return; // 無音のタイムアウトは静かに無視する(連続会話ループもここで自然に止まる)
        addMessage("システム", `音声認識でエラーが発生しました(${event.error})。`);
    });

    micButton.addEventListener("click", () => {
        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
        }
    });
} else {
    micButton.style.display = "none";
}

// ★音声出力(TTS)★ ブラウザ標準のspeechSynthesisを使う。
// ON/OFFの状態はlocalStorageに保存し、リロードしても引き継ぐ
const speakerToggle = document.getElementById("speaker-toggle");
let speechEnabled = localStorage.getItem("falcon-speech-enabled") !== "false"; // 未設定ならON

function updateSpeakerIcon() {
    speakerToggle.textContent = speechEnabled ? "\u{1F50A}" : "\u{1F507}";
}
updateSpeakerIcon();

speakerToggle.addEventListener("click", () => {
    speechEnabled = !speechEnabled;
    localStorage.setItem("falcon-speech-enabled", speechEnabled);
    updateSpeakerIcon();
    if (!speechEnabled) speechSynthesis.cancel();
});

document.getElementById("reload-button").addEventListener("click", () => {
    location.reload();
});


let japaneseVoice = null;
function loadJapaneseVoice() {
    japaneseVoice = speechSynthesis.getVoices().find((v) => v.lang === "ja-JP") || null;
}

if ("speechSynthesis" in window) {
    loadJapaneseVoice();
    speechSynthesis.addEventListener("voiceschanged", loadJapaneseVoice);
}

function stripMarkdownForSpeech(text) {
    return text
        .replace(/\*\*(.*?)\*\*/g, "$1")
        .replace(/`(.*?)`/g, "$1")
        .replace(/^[-*]\s+/gm, "")
        .replace(/\|/g, " ")
        .replace(/^#+\s*/gm, "");
}

// ★連続音声会話★ 音声入力で話しかけた時だけ、FALCONの返事が終わったら自動でマイクを再開する。
// テキストで打った時は再開しない(タイプ入力のつもりで急にマイクが起動すると驚くため)
function speak(text, { continueListening = false } = {}) {
    const canContinue = continueListening && recognition && !isListening;

    if (!speechEnabled || !("speechSynthesis" in window)) {
        // 読み上げがOFFだと「喋り終わった」の合図が無いので、すぐにマイクを再開する
        if (canContinue) recognition.start();
        return;
    }

    const utterance = new SpeechSynthesisUtterance(stripMarkdownForSpeech(text));
    if (japaneseVoice) utterance.voice = japaneseVoice;
    utterance.lang = "ja-JP";

    if (canContinue) {
        utterance.addEventListener("end", () => recognition.start());
    }

    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
}

// CPU/MEM/NETバーを2秒おきに更新する(モバイル幅では非表示だが、裏では動き続けても実害はない)
async function updateStats() {
    try {
        const response = await fetch("/system-stats");
        if (!response.ok) return;
        const data = await response.json();

        document.getElementById("cpu-fill").style.width = `${data.cpu}%`;
        document.getElementById("mem-fill").style.width = `${data.mem}%`;
        document.getElementById("net-fill").style.width = `${data.net}%`;
    } catch (error) {
        // 統計取得の失敗はチャット機能に影響させない(黙って諦める)
    }
}

updateStats();
setInterval(updateStats, 2000);

loadHistory();

// Service Worker登録(オフライン対応)。
// HTTPSかlocalhostでしか動かないため、Tailscaleの証明書でHTTPS化した上で使う前提
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js");
    });
}
    </script>
</body>
</html>
