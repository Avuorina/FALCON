<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALCON</title>
    <link rel="manifest" href="/static/manifest.json">
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #1a1a1a;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    #chat-log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
    }

    #chat-log p {
        max-width: 75%;
        padding: 10px 14px;
        margin-bottom: 10px;
        border-radius: 16px;
        line-height: 1.5;
        word-wrap: break-word;
    }

    #chat-log p.user {
        background-color: #2b5278;
        margin-left: auto;
        border-bottom-right-radius: 4px;
    }

    #chat-log p.falcon {
        background-color: #2f2f2f;
        margin-right: auto;
        border-bottom-left-radius: 4px;
    }

    #chat-log p.system {
        background-color: transparent;
        color: #888;
        font-size: 0.85em;
        text-align: center;
        max-width: 100%;
        margin: 8px auto;
    }

    #chat-form {
        display: flex;
        padding: 12px;
        gap: 8px;
        background-color: #242424;
        border-top: 1px solid #3a3a3a;
    }

    #message-input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 20px;
        border: none;
        background-color: #333;
        color: #e0e0e0;
        font-size: 16px;
    }

    #message-input:focus {
        outline: 2px solid #2b5278;
    }

    #chat-form button {
        padding: 10px 20px;
        border-radius: 20px;
        border: none;
        background-color: #2b5278;
        color: white;
        font-size: 16px;
    }

    #chat-form button:disabled {
        background-color: #444;
        color: #888;
    }
</style>
</head>
<body>
    <div id="chat-log"></div>

    <form id="chat-form">
        <input type="text" id="message-input" placeholder="隼:" autocomplete="off">
        <button type="submit">送信</button>
    </form>

    <script>
const form = document.getElementById("chat-form");
const input = document.getElementById("message-input");
const log = document.getElementById("chat-log");

function addMessage(sender, text) {
    const p = document.createElement("p");
    p.textContent = text;

    if (sender === "隼") {
        p.classList.add("user");
    } else if (sender === "FALCON") {
        p.classList.add("falcon");
    } else {
        p.classList.add("system");
    }

    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
}

async function loadHistory() {
    const response = await fetch("/history");
    const data = await response.json();

    for (const entry of data.history) {
        addMessage(entry.sender, entry.text);
    }
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = input.value.trim();
    if (!message) return;

    addMessage("隼", message);
    input.value = "";

    const submitButton = form.querySelector("button");
    submitButton.disabled = true;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message }),
        });

        if (!response.ok) {
            addMessage("システム", "サーバーでエラーが発生しました。");
            return;
        }

        const data = await response.json();
        addMessage("FALCON", data.reply);
    } catch (error) {
        addMessage("システム", "FALCONに接続できませんでした。Wi-Fiやサーバーの状態を確認してください。");
    } finally {
        submitButton.disabled = false;
    }
});

loadHistory();
    </script>
</body>
</html>
